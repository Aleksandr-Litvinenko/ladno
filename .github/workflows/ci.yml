name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Подключить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Запустить тесты
        run: npm test

      - name: Проверить релизную структуру
        run: npm run validate
